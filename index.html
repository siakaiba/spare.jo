        function showHomeView() {
            currentView = 'home';
            document.getElementById('main-content').innerHTML = homeViewHTML;
            // Update profile button active state styling
            document.getElementById('profile-btn').classList.remove('border-blue-500', 'bg-blue-600/20', 'text-blue-400');
            applyTranslations();
        }

        function showAccountSelectionView() {
            currentView = 'account-selection';
            document.getElementById('main-content').innerHTML = accountSelectionViewHTML;
            // Highlight profile button active state
            document.getElementById('profile-btn').classList.add('border-blue-500', 'bg-blue-600/20', 'text-blue-400');
            applyTranslations();
        }

        // Theme Switcher Function
        function toggleTheme() {
            const body = document.getElementById('app-body');
            const themeIcon = document.getElementById('theme-icon');
            
            if (body.classList.contains('dark')) {
                body.classList.remove('dark');
                body.classList.add('light');
                themeIcon.classList.remove('fa-moon');
                themeIcon.classList.add('fa-sun');
            } else {
                body.classList.remove('light');
                body.classList.add('dark');
                themeIcon.classList.remove('fa-sun');
                themeIcon.classList.add('fa-moon');
            }
        }

        // Language Switcher Function
        function toggleLanguage() {
            currentLang = currentLang === 'en' ? 'ar' : 'en';
            const htmlTag = document.documentElement;
            const langBtn = document.getElementById('lang-btn');

            if (currentLang === 'ar') {
                htmlTag.setAttribute('dir', 'rtl');
                htmlTag.setAttribute('lang', 'ar');
                langBtn.innerText = 'العربية';
            } else {
                htmlTag.setAttribute('dir', 'ltr');
                htmlTag.setAttribute('lang', 'en');
                langBtn.innerText = 'English';
            }

            applyTranslations();
        }

        function applyTranslations() {
            const searchInput = document.getElementById('search-input');
            if (searchInput) {
                searchInput.placeholder = currentLang === 'ar' ? 'أدخل رقم الهيكل (17 خانة)...' : 'Enter 17-digit VIN (Chassis Number)';
            }

            // Translate elements with data-en and data-ar attributes
            document.querySelectorAll('[data-en]').forEach(el => {
                const translation = el.getAttribute(`data-${currentLang}`);
                if (translation) {
                    el.innerText = translation;
                }
            });
        }

        // Live Date and Time Updater script
        function updateDateTime() {
            const now = new Date();
            const locale = currentLang === 'ar' ? 'ar-JO' : 'en-US';
            const dateOptions = { weekday: 'long', year: 'numeric', month: 'short', day: 'numeric' };
            const timeOptions = { hour: 'numeric', minute: '2-digit', hour12: true };
            
            document.getElementById('header-date').innerText = now.toLocaleDateString(locale, dateOptions);
            document.getElementById('header-time').innerText = now.toLocaleTimeString(locale, timeOptions);
        }
        setInterval(updateDateTime, 1000);
        updateDateTime();

        // Initialize default view on load
        showHomeView();
    </script>
</body>
</html>
